version: '3.8'

services:
  # ── 后端 FastAPI ──
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: trip-planner-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/trip/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # 限制内存，防止 Agent 调用时 OOM
    deploy:
      resources:
        limits:
          memory: 2g

  # ── 前端 Nginx（dist 目录从宿主机挂载，本地构建后上传） ──
  frontend:
    image: nginx:alpine
    container_name: trip-planner-frontend
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
